name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test, build and screenshot
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      - name: Build Screensaverr.saver (universal, ad-hoc signed)
        id: build
        run: |
          xcodebuild \
            -project Screensaverr.xcodeproj \
            -target Screensaverr \
            -configuration Release \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- \
            SYMROOT="$PWD/build" \
            -quiet build

      - name: Unit tests (networking, parsing, formatting)
        if: ${{ !cancelled() }}
        run: swift test

      - name: Inspect bundle
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          SAVER=build/Release/Screensaverr.saver
          plutil -p "$SAVER/Contents/Info.plist"
          lipo -info "$SAVER/Contents/MacOS/Screensaverr"
          ls -la "$SAVER/Contents/Resources"
          codesign --verify --deep --strict --verbose=2 "$SAVER"

      - name: Render screenshots against mock servers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          log stream --level debug --style compact \
            --predicate 'subsystem == "com.boonboondesign.Screensaverr"' > oslog.txt 2>&1 &
          python3 ci/mock_server.py 18989 > mock.log 2>&1 &
          swiftc -O ci/render.swift -o build/render
          # On a fresh runner the first connections to a new Python process can stall for
          # ~40s (application firewall evaluation), so wait until the mock answers.
          for i in $(seq 1 120); do
            curl -sf -m 2 http://127.0.0.1:18989/seerr/api/v1/status > /dev/null && break
            sleep 1
          done
          echo "mock server reachable after ${i}s"
          build/render build/Release/Screensaverr.saver screenshots 18989 40
        timeout-minutes: 5

      - name: Mock server and screen saver logs
        if: always()
        run: |
          pkill -f "log stream" || true
          echo "--- mock server ---"; cat mock.log || true
          echo "--- unified log ---"; cat oslog.txt || true

      - name: Package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/Release/Screensaverr.saver dist/Screensaverr.saver.zip
          shasum -a 256 dist/Screensaverr.saver.zip

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: Screensaverr.saver
          path: dist/Screensaverr.saver.zip

      # Keeps the latest screenshots on a throwaway branch so they can be viewed without
      # downloading artifacts (the branch is force-pushed and holds a single commit).
      - name: Publish screenshots to the ci-screenshots branch
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('screenshots/*.png') != '' }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd screenshots
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.png
          git commit -q -m "Screenshots for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Screensaverr.saver
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/Screensaverr.saver.zip
          generate_release_notes: true

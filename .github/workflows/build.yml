name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v1.0.0). Leave empty to just build."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Test, build and screenshot
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      - name: Build Screensaverr.saver (universal, ad-hoc signed)
        id: build
        run: |
          xcodebuild \
            -project Screensaverr.xcodeproj \
            -target Screensaverr \
            -configuration Release \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- \
            SYMROOT="$PWD/build" \
            -quiet build

      # API keys live in the login Keychain; give the tests and the render harness an
      # unlocked default keychain so nothing can wait on a password prompt.
      - name: Unlocked keychain for API key storage
        if: ${{ !cancelled() }}
        run: |
          security create-keychain -p ci ci.keychain
          security set-keychain-settings ci.keychain
          security unlock-keychain -p ci ci.keychain
          security list-keychains -d user -s ci.keychain $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s ci.keychain
          security list-keychains -d user

      - name: Unit tests (networking, parsing, formatting, settings storage)
        if: ${{ !cancelled() }}
        run: swift test
        timeout-minutes: 10

      - name: Inspect bundle
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          SAVER=build/Release/Screensaverr.saver
          plutil -p "$SAVER/Contents/Info.plist"
          lipo -info "$SAVER/Contents/MacOS/Screensaverr"
          ls -la "$SAVER/Contents/Resources"
          codesign --verify --deep --strict --verbose=2 "$SAVER"

      - name: Render screenshots against mock servers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          log stream --level debug --style compact \
            --predicate 'subsystem == "com.boonboondesign.Screensaverr"' > oslog.txt 2>&1 &
          python3 ci/mock_server.py 18989 > mock.log 2>&1 &
          swiftc -O ci/render.swift -o build/render
          # On a fresh runner the first connections to a new Python process can stall for
          # ~40s (application firewall evaluation), so wait until the mock answers.
          for i in $(seq 1 120); do
            curl -sf -m 2 http://127.0.0.1:18989/seerr/api/v1/status > /dev/null && break
            sleep 1
          done
          echo "mock server reachable after ${i}s"
          build/render build/Release/Screensaverr.saver screenshots 18989 42
        timeout-minutes: 5

      - name: Mock server and screen saver logs
        if: always()
        run: |
          pkill -f "log stream" || true
          echo "--- mock server ---"; cat mock.log || true
          echo "--- unified log ---"; cat oslog.txt || true

      - name: Package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/Release/Screensaverr.saver dist/Screensaverr.saver.zip
          shasum -a 256 dist/Screensaverr.saver.zip

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: Screensaverr.saver
          path: dist/Screensaverr.saver.zip

      # Keeps the latest screenshots on a throwaway branch so they can be viewed without
      # downloading artifacts (the branch is force-pushed and holds a single commit).
      - name: Publish screenshots to the ci-screenshots branch
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('screenshots/*.png') != '' }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd screenshots
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.png
          git commit -q -m "Screenshots for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

  release:
    name: Publish release
    needs: build
    # Either push a v* tag, or run the workflow manually with a release_tag.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Screensaverr.saver
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Screensaverr ${{ inputs.release_tag || github.ref_name }}
          files: dist/Screensaverr.saver.zip
          generate_release_notes: true
          body: |
            ## Install

            1. Download **Screensaverr.saver.zip** below and unzip it.
            2. This build is ad-hoc signed, not notarized, so clear the download quarantine first:
               ```bash
               xattr -dr com.apple.quarantine ~/Downloads/Screensaverr.saver
               ```
            3. Double-click **Screensaverr.saver** and install it for this user.
            4. Open **System Settings › Screen Saver**, choose **Screensaverr**, click **Options…**, and add
               the URL and API key for Sonarr, Radarr, Seerr, SABnzbd and Tautulli. Use **Test Connection** to check each one.

            Updating from an earlier version? Run `killall legacyScreenSaver` afterwards so macOS loads the new one.

            Universal build (Apple Silicon + Intel), macOS 13 or later.

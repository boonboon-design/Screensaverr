name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test, build and screenshot
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      - name: Build Screensaverr.saver (universal, ad-hoc signed)
        id: build
        run: |
          xcodebuild \
            -project Screensaverr.xcodeproj \
            -target Screensaverr \
            -configuration Release \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- \
            SYMROOT="$PWD/build" \
            -quiet build

      - name: Unit tests (networking, parsing, formatting)
        if: ${{ !cancelled() }}
        run: swift test

      - name: Inspect bundle
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          SAVER=build/Release/Screensaverr.saver
          plutil -p "$SAVER/Contents/Info.plist"
          lipo -info "$SAVER/Contents/MacOS/Screensaverr"
          ls -la "$SAVER/Contents/Resources"
          codesign --verify --deep --strict --verbose=2 "$SAVER"

      - name: Render screenshots against mock servers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python3 ci/mock_server.py 18989 > mock.log 2>&1 &
          sleep 1
          swiftc -O ci/render.swift -o build/render
          build/render build/Release/Screensaverr.saver screenshots 18989 40
        timeout-minutes: 5

      - name: Mock server log
        if: always()
        run: cat mock.log || true

      - name: Package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/Release/Screensaverr.saver dist/Screensaverr.saver.zip
          shasum -a 256 dist/Screensaverr.saver.zip

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: Screensaverr.saver
          path: dist/Screensaverr.saver.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Screensaverr.saver
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/Screensaverr.saver.zip
          generate_release_notes: true
